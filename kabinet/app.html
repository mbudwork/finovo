<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finovo — кабинет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>

/* Layout: phone-first app shell — one 520px column, sticky header with firm + month, bento cards, glass tab bar, bottom sheets */
:root{
  --bg:#edf2ef; --bg2:#dce8e1; --card:#ffffff; --card2:#f5f8f6; --ink:#13201b; --mute:#5b6a63; --line:rgba(19,32,27,.09);
  --g1:#0c4a3b; --g2:#15705a; --g3:#24a07c; --acc:#15705a; --acc-soft:#dcf0e7;
  --inc:#15705a; --inc-soft:#e0f2ea; --tax:#a8620e; --tax-soft:#fbeedb; --cost:#6449ad; --cost-soft:#eee8fa;
  --bad:#c0364a; --bad-soft:#fbe3e6; --ok:#1b875c; --ok-soft:#dff3e8; --warn:#a8620e; --warn-soft:#fbeedb;
  --glass:rgba(255,255,255,.8); --on-g:#f2fbf7; --on-g-mute:rgba(242,251,247,.72);
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Unbounded","Onest",system-ui,sans-serif;
  --r:22px; --r-s:14px; --tab-h:66px;
  --shadow:0 1px 1px rgba(19,32,27,.03),0 12px 30px -16px rgba(19,32,27,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --bg2:#13211c; --card:#16201c; --card2:#1b2723; --ink:#e6efeb; --mute:#93a39c; --line:rgba(255,255,255,.08);
  --g1:#0b3a2f; --g2:#126150; --g3:#1d8a6c; --acc:#4fcf9f; --acc-soft:#173a2f;
  --inc:#4fcf9f; --inc-soft:#163229; --tax:#e9a855; --tax-soft:#352816; --cost:#b39cf0; --cost-soft:#262038;
  --bad:#f0788a; --bad-soft:#3a1d23; --ok:#4fcf9f; --ok-soft:#163229; --warn:#e9a855; --warn-soft:#352816;
  --glass:rgba(22,32,28,.82); --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --bg2:#13211c; --card:#16201c; --card2:#1b2723; --ink:#e6efeb; --mute:#93a39c; --line:rgba(255,255,255,.08);
  --g1:#0b3a2f; --g2:#126150; --g3:#1d8a6c; --acc:#4fcf9f; --acc-soft:#173a2f;
  --inc:#4fcf9f; --inc-soft:#163229; --tax:#e9a855; --tax-soft:#352816; --cost:#b39cf0; --cost-soft:#262038;
  --bad:#f0788a; --bad-soft:#3a1d23; --ok:#4fcf9f; --ok-soft:#163229; --warn:#e9a855; --warn-soft:#352816;
  --glass:rgba(22,32,28,.82); --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:radial-gradient(900px 520px at 90% -10%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{font-family:var(--f-disp);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
.top-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.firmrow{display:flex;align-items:center;gap:10px}
.firm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;
  color:var(--on-g);background:linear-gradient(140deg,var(--g2),var(--g1));flex:none}
.firm b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.firm span{display:block;font-size:12.5px;color:var(--mute)}
.chev{flex:none;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.monthrow{display:flex;align-items:center;gap:8px}
.mbtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.mbtn:disabled{opacity:.35;cursor:default}
.mlabel{flex:1;font-weight:600;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.p-pre{background:var(--warn-soft);color:var(--warn)}
.p-closed{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--card2);color:var(--mute)}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;padding:0;color:var(--acc);font-weight:600;font-size:13.5px}

.hero{border-radius:26px;padding:20px;color:var(--on-g);position:relative;overflow:hidden;
  background:radial-gradient(420px 220px at 100% 0%,rgba(140,240,200,.28),transparent 60%),linear-gradient(150deg,var(--g3) -20%,var(--g2) 35%,var(--g1));
  box-shadow:0 18px 40px -22px rgba(12,74,59,.8);display:flex;flex-direction:column;gap:6px}
.hero .lbl{font-size:13px;color:var(--on-g-mute);font-weight:500}
.hero .big{font-family:var(--f-disp);font-weight:600;font-size:clamp(32px,10vw,44px);line-height:1.05;letter-spacing:-.03em}
.hero .big small{font-size:.45em;font-weight:500;margin-left:4px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--on-g-mute)}
.hero .sub b{color:var(--on-g);font-weight:600}
.hero svg{display:block;width:100%;height:56px;margin-top:6px}
.hero .note{font-size:12px;color:var(--on-g-mute)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;text-align:left}
.tile .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--f-disp);font-weight:600;font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--mute)}
.t-inc{background:var(--inc-soft)} .t-inc .t{color:var(--inc)}
.t-cost{background:var(--cost-soft)} .t-cost .t{color:var(--cost)}
.t-tax{background:var(--tax-soft)} .t-tax .t{color:var(--tax)}
.t-mine{background:var(--card)} .t-mine .t{color:var(--acc)}
.t-mine{box-shadow:var(--shadow)}

.reserve{display:flex;gap:16px;align-items:center}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:18px}
.reserve .rt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-weight:600}
.status-line{font-weight:600;font-size:14px}
.st-ok{color:var(--ok)} .st-bad{color:var(--bad)} .st-mute{color:var(--mute)}

.next{display:flex;align-items:center;gap:14px}
.datebox{flex:none;width:56px;height:60px;border-radius:14px;background:var(--tax-soft);color:var(--tax);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-family:var(--f-disp);font-size:22px;font-weight:600}
.datebox span{font-size:11.5px;font-weight:600;text-transform:uppercase;margin-top:4px}
.datebox.urgent{background:var(--bad-soft);color:var(--bad)}

.bureau{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:12px 14px;border:0;text-align:left;width:100%}
.bureau .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.bureau .dot.ok{background:var(--ok)}
.bureau p{flex:1;font-size:14px}

.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;font-size:14.5px;background:var(--acc);color:var(--on-g);display:inline-flex;align-items:center;justify-content:center;gap:8px}
:root[data-theme="dark"] .btn{color:#0b201a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0b201a}}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.block{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.ico{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:700}
.ico.in{background:var(--inc-soft);color:var(--inc)} .ico.out{background:var(--cost-soft);color:var(--cost)} .ico.tx{background:var(--tax-soft);color:var(--tax)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main span{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none;font-weight:600}
.row .amt span{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.plus{color:var(--inc)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--mute);vertical-align:1px;margin-left:4px}
.badge.link{color:var(--acc);cursor:pointer;font-size:10.5px;padding:2px 6px;background:var(--card2)}

.hbar{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.hb .track{grid-column:1/-1;height:8px;border-radius:6px;background:var(--card2);overflow:hidden}
.hb .fill{height:100%;border-radius:6px;background:var(--cost)}
.hb.inc .fill{background:var(--inc)}

.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--mute);font-size:10.5px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.tax{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tax:first-child{border-top:0;padding-top:2px}
.tax .datebox{width:50px;height:54px}
.tax .datebox b{font-size:19px}
.tax .main{flex:1;min-width:0}
.tax .main b{display:block;font-weight:600;font-size:14.5px}
.tax .main span{display:block;font-size:12.5px;color:var(--mute)}
.tax .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tax .right .num{font-weight:600}
.chipbtn{border:0;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:700}

.person{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:2px}
.ph{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ph .main{flex:1;min-width:0}
.ph .main b{display:block;font-weight:600}
.ph .main span{font-size:12.5px;color:var(--mute)}
.pay3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pay3 div{background:var(--card2);border-radius:12px;padding:8px 10px}
.pay3 span{display:block;font-size:11.5px;color:var(--mute)}
.pay3 b{font-weight:600;font-size:14px}
.docs{display:flex;flex-wrap:wrap;gap:6px}
.doc{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--mute);font-weight:500}
.doc.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}
.doc.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}

.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0;padding-top:2px}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px}
.box.on{background:var(--ok);border-color:var(--ok);color:var(--on-g)}

.demo{font-size:12.5px;color:var(--mute);text-align:center;padding:4px 8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs{max-width:520px;margin:0 auto;height:var(--tab-h);border-radius:22px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);pointer-events:auto;padding:4px}
.tab{border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--acc);background:var(--acc-soft)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(5,15,11,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);font-size:18px;line-height:1}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}.ring circle{transition:none!important}}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select{font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.firmpick{display:flex;flex-direction:column;gap:8px}
.firmopt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.firmopt[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.firmopt .main b{display:block}
.firmopt .main span{font-size:12.5px;color:var(--mute)}
input[type=range]{width:100%;accent-color:var(--acc)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp div{background:var(--card2);border-radius:14px;padding:12px}
.cmp span{font-size:12px;color:var(--mute);display:block}
.cmp b{font-family:var(--f-disp);font-weight:600;font-size:18px}
.delta-up{color:var(--ok)} .delta-down{color:var(--bad)}
@media (max-width:360px){.pay3{grid-template-columns:1fr 1fr}.tile .v{font-size:17px}}

/* Дополнения к base.css: вход, пульт бюро, широкая раскладка, формы */
.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding-block:40px}
.login .card{width:100%;max-width:400px}
.login .brand{display:flex;align-items:center;gap:12px}
.login .brand .logo{width:46px;height:46px;font-size:18px}
.err{color:var(--bad);font-size:13.5px;min-height:18px}
.demo-acc{display:flex;flex-direction:column;gap:6px;font-size:13px}
.demo-acc button{border:1px dashed var(--line);background:var(--card2);border-radius:12px;padding:9px 12px;text-align:left;font-size:13px}
.demo-acc button b{font-weight:600}

.asbanner{max-width:520px;margin:0 auto 10px;display:flex;align-items:center;gap:10px;background:var(--cost-soft);color:var(--cost);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:600}
.asbanner button{margin-left:auto;border:0;background:var(--card);border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}

.trend{font-size:11.5px;font-weight:600}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)} .trend.flat{color:var(--mute)}
.tile .s{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.fc svg{display:block;width:100%;height:auto}
.fc .ax{fill:var(--mute);font-size:10.5px;font-family:var(--f-body)}
.explain .row .amt{font-weight:600}
.eq{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.eq:first-child{border-top:0}
.eq.total{font-weight:700;border-top:2px solid var(--ink)}
.eq .op{color:var(--mute);width:18px;flex:none}
.eq span:nth-child(2){flex:1}

.reqrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}

<script>
/* Демо-режим: база в памяти браузера вместо Supabase. Данные вымышленные. */
(function () {
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Math.random().toString(36).slice(2));
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const pad = n => String(n).padStart(2, '0');
  const d0 = new Date(), TODAY = d0.getFullYear() + '-' + pad(d0.getMonth() + 1) + '-' + pad(d0.getDate());
  const Y = +TODAY.slice(0, 4), CURM = +TODAY.slice(5, 7), CURD = +TODAY.slice(8);
  const addDays = (d, n) => new Date(Date.parse(d) + n * 864e5).toISOString().slice(0, 10);
  const dayIn = (m, d) => Y + '-' + pad(m) + '-' + pad(d);
  const minD = (a, b) => a < b ? a : b;

  const T = { firms: [], firm_members: [], staff: [], invoices: [], employees: [], employee_docs: [], month_close: [], payments: [], requests: [], documents: [], bank_balances: [], bank_tx: [], notifications: [], push_subscriptions: [], notify_prefs: [], audit_log: [] };
  const USERS = [{ id: 'u-biuro', email: 'biuro@kabinet.demo' }, { id: 'u-budmax', email: 'budmax@kabinet.demo' }, { id: 'u-novabud', email: 'novabud@kabinet.demo' }];
  T.staff.push({ user_id: 'u-biuro', name: 'Бюро (демо)', role: 'admin' });
  const SEASON = [0.72, 0.78, 0.92, 1, 1.05, 1.08, 1.1, 1.04, 1.06, 1.0, 0.95, 0.8];
  const CFG = [
    { id: 'firm-budmax', user: 'u-budmax', owner: 'Andrii Kovalenko', seed: 11, name: 'BUDMAX Andrii Kovalenko', short: 'BUDMAX', nip: '5250000001', type: 'jdg', tax: 'liniowy', zus: 'pelny', bal: 41250,
      rev: 68000, mat: 0.22, fuel: 0.03, leasing: 2400, acct: 900, tel: 320, clients: [['Domex Development Sp. z o.o.', '23'], ['Atrium Inwestycje Sp. z o.o.', '23'], ['Dom jednorodzinny — Nowak Anna', '8']],
      suppliers: ['Hurtownia Budowlana Kamex', 'Skład Glazury Ceramik-Pol', 'Bud-Chem Hurt'], subs: [],
      staff: [['Taras Melnyk', 'Плиточник', 'uop', 7200, [['Разрешение на работу', 165], ['Медосмотр', 18], ['BHP', 94]]], ['Oleh Bondar', 'Отделочник', 'uop', 6500, [['Karta pobytu', 41], ['Медосмотр', 204]]], ['Piotr Wiśniewski', 'Помощник', 'zlec', 5200, [['Медосмотр', -16]]]],
      requests: [['Выписка за текущий месяц', 'CSV или MT940 из банка', 18], ['Чек на топливо без фактуры', 'Фото чека — фактуры нет в KSeF', 7]] },
    { id: 'firm-novabud', user: 'u-novabud', owner: 'Olha Marchenko', seed: 29, name: 'NOVABUD Sp. z o.o.', short: 'NOVABUD', nip: '5250000002', type: 'sp', tax: 'cit9', zus: 'brak', bal: 236400,
      rev: 212000, mat: 0.24, fuel: 0.025, leasing: 6800, acct: 2200, tel: 890, clients: [['Kraft Residence Sp. z o.o.', '23'], ['Osiedle Zielone Tarasy Sp. k.', '23'], ['Bauwerk Schulz GmbH', 'np'], ['Hotel Wisła Sp. z o.o.', '23']],
      suppliers: ['Hurtownia Budowlana Kamex', 'Stal-Mix Dystrybucja', 'Bud-Chem Hurt', 'Wynajem Rusztowań Tower'], subs: [['Serhii Hrytsenko', 'Электрик, субподряд', 14000], ['Mykola Savchuk', 'Сантехник, субподряд', 12500]],
      staff: [['Vasyl Petrenko', 'Бригадир', 'uop', 9800, [['Разрешение на работу', 255], ['A1', 74], ['Медосмотр', 119]]], ['Ivan Lysenko', 'Монтажник ГКЛ', 'uop', 7400, [['Разрешение на работу', 23], ['Медосмотр', 83]]],
        ['Dmytro Koval', 'Монтажник ГКЛ', 'uop', 7400, [['Karta pobytu', 530], ['Медосмотр', 11]]], ['Andrzej Nowak', 'Плиточник', 'uop', 8200, [['Медосмотр', 287], ['BHP', -18]]],
        ['Yurii Tkachenko', 'Маляр', 'zlec', 6100, [['Разрешение на работу', 105]]], ['Roman Shevchuk', 'Разнорабочий', 'zlec', 5400, [['Разрешение на работу', 209], ['Медосмотр', 135]]]],
      requests: [['Выписка за текущий месяц', 'CSV или MT940 из банка', 18], ['Договор с Hotel Wisła', 'Скан подписанного договора', 12], ['Rechnung от Bauwerk Schulz', 'Немецкая фактура вне KSeF — фото или PDF', 7]] }
  ];
  for (const c of CFG) {
    const R = rng(c.seed), pick = a => a[Math.floor(R() * a.length)], fid = c.id;
    T.firms.push({ id: fid, name: c.name, short: c.short, nip: c.nip, type: c.type, tax_form: c.tax, vat_payer: true, zus_mode: c.zus, opening_balance: 0, ryczalt_rate: null });
    T.firm_members.push({ firm_id: fid, user_id: c.user, name: c.owner, role: 'owner' });
    const inv = (m, day, kind, cat, who, net, num, vr = '23', paid = true, cur = 'PLN', fx = 1) => {
      net = Math.round(net / 10) * 10; const d = dayIn(m, day); const vat = vr === 'np' ? 0 : Math.round(net * (+vr) / 100 * 100) / 100;
      let paidAt = paid ? addDays(d, kind === 'sale' ? 6 + Math.floor(R() * 7) : 2 + Math.floor(R() * 8)) : null; if (paidAt && paidAt > TODAY) paidAt = null;
      T.invoices.push({ id: uid(), firm_id: fid, kind, number: num, issue_date: d, due_date: addDays(d, 14), counterparty: who, net, vat, vat_rate: vr, currency: cur, fx, category: cat, source: 'ksef', paid_at: paidAt });
    };
    for (let m = 1; m <= CURM; m++) {
      const cur = m === CURM, maxDay = cur ? Math.max(3, CURD - 1) : 28;
      const rev = c.rev * SEASON[m - 1] * (0.9 + R() * 0.2) * (cur ? Math.min(1, CURD / 30) : 1);
      const n = c.clients.length > 3 ? 3 : 2 + (R() > .5 ? 1 : 0); let left = rev;
      for (let i = 0; i < n; i++) {
        const part = i === n - 1 ? left : rev * (0.25 + R() * 0.2); left -= part;
        const day = Math.min(maxDay, 4 + i * Math.floor(22 / n) + Math.floor(R() * 4)), [who, vr] = c.clients[(m + i) % c.clients.length];
        const unpaid = (cur && i === n - 1) || (m === CURM - 1 && i === n - 1);
        if (vr === 'np') inv(m, day, 'sale', 'Выручка', who, part / 4.25, `FV ${i + 1}/${pad(m)}/${Y}`, 'np', !unpaid, 'EUR', 4.25);
        else inv(m, day, 'sale', 'Выручка', who, part, `FV ${i + 1}/${pad(m)}/${Y}`, vr, !unpaid);
      }
      const mats = rev * c.mat, nm = 2 + Math.floor(R() * 3);
      for (let i = 0; i < nm; i++) inv(m, Math.min(maxDay, 3 + Math.floor(R() * 24)), 'cost', 'Материалы', pick(c.suppliers), mats / nm * (0.8 + R() * 0.4), 'FV/' + Math.floor(1000 + R() * 8999), '23', !(cur && i === 0));
      inv(m, Math.min(maxDay, 27), 'cost', 'Топливо', 'Stacja paliw — karta flotowa', rev * c.fuel, 'FV zbiorcza ' + pad(m));
      inv(m, Math.min(maxDay, 10), 'cost', 'Лизинг', 'Leasing samochodu dostawczego', c.leasing, 'FV leasing ' + pad(m));
      inv(m, Math.min(maxDay, 5), 'cost', 'Бухгалтерия', 'Biuro rachunkowe', c.acct, 'FV księgowość ' + pad(m));
      inv(m, Math.min(maxDay, 14), 'cost', 'Связь и софт', 'Telefon, internet, programy', c.tel, 'FV abonament ' + pad(m));
      if (R() > .55) inv(m, Math.min(maxDay, 8 + Math.floor(R() * 15)), 'cost', 'Инструмент', 'Narzędzia — hurtownia', 800 + R() * 3200, 'FV/' + Math.floor(100 + R() * 899));
      for (const s of c.subs) inv(m, Math.min(maxDay, 26), 'cost', 'Субподряд', s[0], s[2] * (cur ? 0.6 : 1), `FV ${m}/${Y}`);
      if (m <= CURM - 1) T.month_close.push({ firm_id: fid, ym: Y + '-' + pad(m), status: 'closed', closed_at: dayIn(m + 1 > 12 ? 12 : m + 1, 15) });
      if (m <= CURM - 2) ['zus', 'pit4', 'it', 'vat'].forEach(k => T.payments.push({ firm_id: fid, ym: Y + '-' + pad(m), kind: k, paid_at: dayIn(m + 1, k === 'vat' ? 24 : k === 'zus' && c.type === 'sp' ? 14 : 19) }));
    }
    for (const [n, role, con, b, docs] of c.staff) {
      const eid = uid(); T.employees.push({ id: eid, firm_id: fid, name: n, role, contract: con, brutto: b, start_date: (Y - 1) + '-03-01', end_date: null, active: true });
      docs.forEach(([k, dd]) => T.employee_docs.push({ id: uid(), employee_id: eid, firm_id: fid, kind: k, valid_to: addDays(TODAY, dd) }));
    }

function vHome(d) {
  const f = d.firm, m = monthOf(d, S.ym), prev = monthOf(d, Calc.ymAdd(S.ym, -1));
  const ytd = d.year.filter(x => x.ym <= S.ym).reduce((s, x) => s + x.mine, 0);
  const res = reserveOf(d), bal = d.balance, st = bal ? (bal.balance >= res.need ? 'ok' : 'bad') : 'none';
  const next = obligationsOf(d).filter(o => !o.paid_at).sort((a, b) => a.due.localeCompare(b.due))[0];
  const asks = d.requests.filter(r => r.status === 'open').length;
  const hint = f.type === 'jdg' ? 'после ' + itName(f) + ', ZUS и składki zdrowotnej' : 'после CIT и 19% налога на дивиденд';
  let fcHtml = '';
  if (bal) { const fc = Calc.forecast(d, d.year, TODAY, +bal.balance, 30);
    fcHtml = `<button class="card" data-sheet="forecast" style="border:0;text-align:left;width:100%"><div class="card-h"><h2>Деньги через 30 дней</h2><span class="link">Подробно</span></div>
      <div class="kv"><span class="mute">Ожидаемый остаток ${dShort(fc.end)}</span><b class="num">${zl(fc.endBalance)}</b></div>
      <div class="kv"><span class="mute">Самый низкий момент · ${dShort(fc.min.date)}</span><b class="num" style="color:${fc.min.bal < 0 ? 'var(--bad)' : 'inherit'}">${zl(fc.min.bal)}</b></div>
      ${fc.min.bal < 0 ? '<p class="status-line st-bad">Денег может не хватить — посмотрите, кто должен заплатить</p>' : ''}</button>`; }
  return `
  <section class="hero" aria-label="${mineLabel(f)}">
    <div class="lbl">${mineLabel(f)} · ${mLow(S.ym)}${m.closed ? '' : ' (пока)'}</div>
    <button class="big num" data-explain="mine" style="background:none;border:0;color:inherit;padding:0;text-align:left">${fmt(m.mine)}<small>zł</small></button>
    <div class="sub"><span>С начала года <b class="num">${zl(ytd)}</b></span><span>Прибыль фирмы <b class="num">${zl(m.profit)}</b></span></div>
    ${spark(d.year.map(x => x.mine))}
    <div class="note">${hint}${m.closed ? '' : ' · месяц ещё идёт'} · нажмите на сумму, чтобы увидеть расчёт</div>
  </section>
  <div class="tiles">
    <button class="tile t-inc" data-explain="rev"><span class="t">Пришло</span><span class="v num">${zl(m.rev)}</span><span class="s">${m.sales.length} фактур ${trend(m.rev, prev && prev.rev)}</span></button>
    <button class="tile t-cost" data-explain="costs"><span class="t">Ушло</span><span class="v num">${zl(m.costsAll)}</span><span class="s">с зарплатами ${trend(m.costsAll, prev && prev.costsAll, false)}</span></button>
    <button class="tile t-tax" data-explain="taxes"><span class="t">Налоги и ZUS</span><span class="v num">${zl(m.taxes)}</span><span class="s">VAT, ${itName(f)}, ZUS, PIT-4</span></button>
    <button class="tile t-mine" data-sheet="analytics"><span class="t">Маржа</span><span class="v num">${m.rev ? fmt(m.profit / m.rev * 100, 1) + '%' : '—'}</span><span class="s">Аналитика →</span></button>
  </div>
  <section class="card" aria-label="Резерв на налоги">
    <div class="card-h"><h2>Резерв на налоги</h2>${bal ? `<span class="small mute">банк на ${dShort(bal.date)}</span>` : ''}</div>
    <div class="reserve">${ring(bal ? (res.need ? bal.balance / res.need : 1) : 0, st)}
      <div class="rt">
        <div class="kv"><span class="mute">Должно лежать</span><b class="num">${zl(res.need)}</b></div>
        <div class="kv"><span class="mute">На счёте</span><b class="num">${bal ? zl(bal.balance) : '—'}</b></div>
        <div class="status-line ${st === 'ok' ? 'st-ok' : st === 'bad' ? 'st-bad' : 'st-mute'}">${st === 'ok' ? 'Хватает, запас ' + zl(bal.balance - res.need) : st === 'bad' ? 'Не хватает ' + zl(res.need - bal.balance) : 'Бюро ещё не загрузило выписку'}</div>
      </div>
    </div>
    <p class="small mute">С каждого поступления откладывайте <b style="color:var(--ink)">${fmt(res.pct, 1)}%</b> — столько в среднем уходило на налоги за 3 последних месяца.</p>
  </section>
  ${fcHtml}
  ${next ? `<section class="card"><div class="card-h"><h2>Ближайший платёж</h2><button class="link" data-go="taxes">Все</button></div>
    <div class="next"><div class="datebox ${next.days <= 7 ? 'urgent' : ''}"><b>${+next.due.slice(8)}</b><span>${MON_S[+next.due.slice(5, 7) - 1]}</span></div>
    <div style="flex:1;min-width:0"><b style="display:block">${esc(next.name)}</b><span class="small mute">за ${mLow(next.ym)} · ${next.days < 0 ? 'просрочен на ' + (-next.days) + ' дн.' : next.days === 0 ? 'сегодня' : 'через ' + next.days + ' дн.'}</span></div>
    <b class="num">${zl(next.amt)}</b></div></section>` : ''}
  <button class="bureau" data-go="docs"><span class="dot ${asks ? '' : 'ok'}"></span><p>${asks ? `Бюро ждёт от вас ${asks} ${asks === 1 ? 'документ' : asks < 5 ? 'документа' : 'документов'}` : 'Бюро ничего не ждёт. Всё в порядке'}</p><span aria-hidden="true">›</span></button>`;
}

function vMoney(d) {
  const m = monthOf(d, S.ym), bal = d.balance;
  const cats = {}; m.costs.forEach(i => { cats[i.category || 'Прочее'] = (cats[i.category || 'Прочее'] || 0) + Calc.pln(i); }); if (m.pay.cost) cats['Зарплаты (полная стоимость)'] = m.pay.cost;
  const catArr = Object.entries(cats).sort((a, b) => b[1] - a[1]), cmax = catArr[0] ? catArr[0][1] : 1;
  const cli = {}; m.sales.forEach(i => { cli[i.counterparty] = (cli[i.counterparty] || 0) + Calc.pln(i); });
  const owe = d.invoices.filter(i => i.kind === 'sale' && !i.paid_at), weOwe = d.invoices.filter(i => i.kind === 'cost' && !i.paid_at);
  const g = i => Calc.pln(i) + Calc.plnVat(i);
  const bank = d.bank.filter(t => t.date.slice(0, 7) === S.ym);
  const ops = [...m.sales, ...m.costs].sort((a, b) => b.issue_date.localeCompare(a.issue_date));
  return `
  <section class="card"><div class="card-h"><h2>Деньги</h2>${statusPill(m)}</div>
    <div class="kv"><span class="mute">На счёте</span><b class="num" style="font-family:var(--f-disp);font-size:20px">${bal ? zl(bal.balance) : '—'}</b></div>
    <p class="small mute">${bal ? 'по выписке на ' + dDots(bal.date) : 'Выписку загружает бюро — цифра появится после первой загрузки'}</p>
    ${bal ? '<button class="btn ghost block" data-sheet="forecast">Прогноз на 30 дней</button>' : ''}
  </section>
  <section class="card chart"><div class="card-h"><h2>Приход и расход</h2><span class="small mute">нетто, ${YEAR}</span></div>${bars(d)}
    <div class="legend"><span><i style="background:var(--inc)"></i>Пришло</span><span><i style="background:var(--cost)"></i>Ушло с зарплатами</span></div></section>
  <div class="tiles">
    <div class="tile t-inc"><span class="t">Вам должны</span><span class="v num">${zl(owe.reduce((s, i) => s + g(i), 0))}</span><span class="s">${owe.length} неоплач. фактур</span></div>
    <div class="tile t-cost"><span class="t">Вы должны</span><span class="v num">${zl(weOwe.reduce((s, i) => s + g(i), 0))}</span><span class="s">${weOwe.length} счетов поставщикам</span></div>
  </div>
  ${owe.length ? `<section class="card"><h2>Кто не заплатил</h2><div class="list">${owe.sort((a, b) => (a.due_date || '').localeCompare(b.due_date || '')).map(i => { const late = i.due_date ? days(i.due_date) : 0;
    return `<div class="row"><div class="ico in">FV</div><div class="main"><b>${esc(i.counterparty)}</b><span>${esc(i.number)} · ${late < 0 ? '<span style="color:var(--bad)">просрочено ' + (-late) + ' дн.</span>' : 'срок через ' + late + ' дн.'}</span></div><div class="amt num">${zl(g(i))}<span><button class="link" data-remind="${i.id}">Напомнить</button></span></div></div>`; }).join('')}</div></section>` : ''}
  <section class="card"><h2>Куда ушли деньги · ${mLow(S.ym)}</h2><div class="hbar">${catArr.map(([c, v]) => `<div class="hb"><span>${esc(c)}</span><b class="num">${zl(v)}</b><div class="track"><div class="fill" style="width:${(v / cmax * 100).toFixed(1)}%"></div></div></div>`).join('') || '<p class="mute">Расходов нет</p>'}</div></section>
  <section class="card"><h2>Клиенты · ${mLow(S.ym)}</h2><div class="hbar">${Object.entries(cli).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div class="hb inc"><span>${esc(c)}</span><b class="num">${zl(v)}</b><div class="track"><div class="fill" style="width:${(v / (m.rev || 1) * 100).toFixed(1)}%"></div></div></div>`).join('') || '<p class="mute">Продаж нет</p>'}</div></section>
  ${bank.length ? `<section class="card"><div class="card-h"><h2>Из банка</h2><span class="small mute">${bank.length} операций</span></div><div class="list">${bank.slice(0, 40).map(t => `<div class="row"><div class="ico ${t.amount > 0 ? 'in' : 'out'}">${t.amount > 0 ? '+' : '−'}</div><div class="main"><b>${esc(t.category)}</b><span>${esc(t.description)}</span></div><div class="amt num ${t.amount > 0 ? 'plus' : ''}">${t.amount > 0 ? '+' : ''}${zl(t.amount, 2)}<span>${dDots(t.date)}</span></div></div>`).join('')}</div></section>` : ''}
  <section class="card"><div class="card-h"><h2>Фактуры · ${mLow(S.ym)}</h2><span class="small mute">${ops.length} шт.</span></div><div class="list">${ops.map(i => `<div class="row"><div class="ico ${i.kind === 'sale' ? 'in' : 'out'}">${i.kind === 'sale' ? '+' : '−'}</div><div class="main"><b>${esc(i.counterparty)}</b><span>${esc(i.category || '')} · ${dDots(i.issue_date)}${i.ksef_xml ? `<button class="badge link" data-doc="${esc(i.ksef_xml)}" title="Открыть XML из KSeF">KSEF</button>` : `<span class="badge">${esc(i.source).toUpperCase()}</span>`}${i.vat_rate !== '23' ? `<span class="badge">VAT ${esc(i.vat_rate)}${i.vat_rate === 'np' ? '' : '%'}</span>` : ''}${i.paid_at ? '' : '<span class="badge" style="color:var(--warn)">не оплачено</span>'}</span></div><div class="amt num ${i.kind === 'sale' ? 'plus' : ''}">${i.kind === 'sale' ? '+' : '−'}${i.currency !== 'PLN' ? fmt(i.net) + ' ' + esc(i.currency) : zl(i.net)}<span>${i.currency !== 'PLN' ? '≈ ' + zl(Calc.pln(i)) : 'VAT ' + zl(i.vat)}</span></div></div>`).join('')}</div></section>`;
}

function vTaxes(d) {
  const f = d.firm, all = obligationsOf(d), upcoming = all.filter(o => !o.paid_at || days(o.paid_at) >= -7).sort((a, b) => a.due.localeCompare(b.due));
  const m = monthOf(d, S.ym), ytd = d.year.filter(x => x.ym <= S.ym), ytdTax = ytd.reduce((s, x) => s + x.taxes, 0), ytdRev = ytd.reduce((s, x) => s + x.rev, 0);
  const row = o => `<div class="tax"><div class="datebox ${o.state === 'paid' ? '' : o.days <= 7 ? 'urgent' : ''}" style="${o.state === 'paid' ? 'background:var(--card2);color:var(--mute)' : ''}"><b>${+o.due.slice(8)}</b><span>${MON_S[+o.due.slice(5, 7) - 1]}</span></div>
    <div class="main"><b>${esc(o.name)}</b><span>за ${mLow(o.ym)}${o.closed ? '' : ' · предварительно'}</span></div>
    <div class="right"><span class="num">${zl(o.amt, 2)}</span><span class="pill ${o.state === 'paid' ? 'p-closed' : o.state === 'late' ? 'p-bad' : 'p-pre'}">${o.state === 'paid' ? 'оплачено ' + dDots(o.paid_at) : o.state === 'late' ? 'просрочено' : 'ждёт оплаты'}</span></div></div>`;
  const rateRows = Object.entries(m.byRate).map(([r, v]) => `${r === 'np' ? 'вне Польши (np)' : r + '%'}: ${zl(v)}`).join(' · ');
  const smallCitPln = Calc.RATES.smallCitPln;
  return `
  <section class="card"><div class="card-h"><h2>Календарь платежей</h2></div>
    <div>${upcoming.map(row).join('') || '<p class="mute">Все платежи оплачены.</p>'}</div>
    <p class="small mute">${f.type === 'sp' ? 'ZUS — до 15-го, CIT и PIT-4 — до 20-го' : 'ZUS, PIT и PIT-4 — до 20-го'}, VAT — до 25-го следующего месяца; выходной или праздник переносит срок на следующий рабочий день. Отметку «оплачено» ставит бюро по выписке.</p>
  </section>
  <section class="card"><div class="card-h"><h2>${MONTHS[+S.ym.slice(5) - 1]}: из чего налоги</h2>${statusPill(m)}</div>
    <div class="list">
      <div class="row"><div class="main"><b>VAT</b><span>начислено ${zl(m.vatOut)} − к вычету ${zl(m.vatIn)}${m.vatCarry ? ' · к переносу ' + zl(m.vatCarry) : ''}</span></div><div class="amt num">${zl(m.fin.vat)}</div></div>
      <div class="row"><div class="main"><b>${itName(f)}</b><span>${f.type === 'jdg' ? 'нарастающим итогом с января, минус уже уплаченные авансы' : 'CIT ' + (f.tax_form === 'cit19' ? '19' : '9') + '% от прибыли с начала года, минус авансы'}</span></div><div class="amt num">${zl(m.fin.it)}</div></div>
      <div class="row"><div class="main"><b>ZUS</b><span>${f.type === 'jdg' && m.ownerSpol ? 'ваш: społeczne ' + zl(m.ownerSpol) + ' + zdrowotna ' + zl(m.ownerZdr) + '; работники ' + zl(m.staffZus) : 'за работников: их взносы и взносы фирмы'}</span></div><div class="amt num">${zl(m.fin.zus)}</div></div>
      <div class="row"><div class="main"><b>PIT-4</b><span>налог, удержанный из зарплат</span></div><div class="amt num">${zl(m.fin.pit4)}</div></div>
      ${f.type === 'sp' ? `<div class="row"><div class="main"><b>Налог на дивиденд</b><span>19% — только если заберёте прибыль</span></div><div class="amt num mute">${zl(m.extra.divTax)}</div></div>` : ''}
    </div>
    ${rateRows ? `<p class="small mute">Продажи по ставкам VAT: ${rateRows}.</p>` : ''}
  </section>
  <section class="card"><h2>С начала года</h2>
    <div class="cmp"><div><span>Отдали государству</span><b class="num">${zl(ytdTax)}</b></div><div><span>Это от выручки</span><b class="num">${ytdRev ? fmt(ytdTax / ytdRev * 100, 1) : 0}%</b></div></div>
    ${f.type === 'sp' && f.tax_form === 'cit9' ? `<div class="hb inc"><span>Лимит CIT 9% (2 млн € ≈ ${zl(smallCitPln)})</span><b class="num">${fmt(ytdRev / smallCitPln * 100, 1)}%</b><div class="track"><div class="fill" style="width:${Math.min(100, ytdRev / smallCitPln * 100).toFixed(1)}%"></div></div></div>` : ''}
    ${!f.vat_payer ? `<div class="hb inc"><span>Освобождение от VAT (240 000 zł)</span><b class="num">${fmt(ytdRev / 240000 * 100, 1)}%</b><div class="track"><div class="fill" style="width:${Math.min(100, ytdRev / 2400).toFixed(1)}%"></div></div></div>` : ''}
  </section>
  <section class="card"><h2>Куда платить</h2>
    <p class="small">PIT, CIT, VAT и PIT-4 — на <b>mikrorachunek podatkowy</b> фирмы (личный счёт по NIP${f.nip ? ' ' + esc(f.nip) : ''}). ZUS — на ваш счёт в ZUS.</p>
    <p class="small mute">Точные номера счетов пришлёт бюро вместе с суммами.</p>
  </section>`;
}

function vPeople(d) {
  const staff = d.employees.filter(e => e.active !== false && !e.end_date).map(e => ({ ...e, w: Calc.wage(+e.brutto, e.contract) }));
  const team = staff.reduce((a, s) => a + s.w.cost, 0), hands = staff.reduce((a, s) => a + s.w.netto, 0);
  const docs = staff.flatMap(s => (s.employee_docs || []).map(x => ({ s, x, dd: days(x.valid_to) }))).filter(x => x.dd <= 30).sort((a, b) => a.dd - b.dd);
  const chip = x => { const dd = days(x.valid_to), cls = dd < 0 ? 'bad' : dd <= 30 ? 'warn' : ''; return `<span class="doc ${cls}">${esc(x.kind)} · ${dd < 0 ? 'истёк' : dd <= 30 ? 'через ' + dd + ' дн.' : 'до ' + dDots(x.valid_to)}</span>`; };
  return `
  <section class="card"><div class="card-h"><h2>Команда</h2><span class="small mute">${staff.length} чел.</span></div>
    <div class="cmp"><div><span>Стоит фирме в месяц</span><b class="num">${zl(team)}</b></div><div><span>На руки людям</span><b class="num">${zl(hands)}</b></div></div>
    <p class="small mute">Разница — ZUS, налог и взносы работодателя. Субподрядчики B2B — по фактурам, без ZUS. Зарплата выплачивается до 10-го числа.</p>
  </section>
  ${docs.length ? `<section class="card"><h2>Сроки документов</h2><div class="list">${docs.map(x => `<div class="row"><div class="ico tx" style="${x.dd < 0 ? 'background:var(--bad-soft);color:var(--bad)' : ''}">!</div><div class="main"><b>${esc(x.s.name)}</b><span>${esc(x.x.kind)}</span></div><div class="amt" style="color:${x.dd < 0 ? 'var(--bad)' : 'var(--warn)'}">${x.dd < 0 ? 'истёк ' + (-x.dd) + ' дн. назад' : 'через ' + x.dd + ' дн.'}</div></div>`).join('')}</div></section>` : ''}
  <section class="card"><h2>Люди</h2><div>${staff.map(s => `<div class="person"><div class="ph"><div class="avatar" style="${s.contract === 'b2b' ? 'background:var(--cost-soft);color:var(--cost)' : ''}">${s.contract === 'b2b' ? 'B2B' : esc(s.name.split(' ').map(x => x[0]).join('').slice(0, 2))}</div><div class="main"><b>${esc(s.name)}</b><span>${esc(s.role || '')} · ${CONTRACT[s.contract]}</span></div></div>
    <div class="pay3">${s.contract === 'b2b' ? `<div><span>Фактура нетто</span><b class="num">${zl(s.brutto)}</b></div><div><span>VAT</span><b class="num">${zl(s.brutto * 0.23)}</b></div><div><span>Стоит фирме</span><b class="num">${zl(s.brutto)}</b></div>` : `<div><span>Брутто</span><b class="num">${zl(s.w.brutto)}</b></div><div><span>На руки</span><b class="num">${zl(s.w.netto)}</b></div><div><span>Стоит фирме</span><b class="num">${zl(s.w.cost)}</b></div>`}</div>
    ${(s.employee_docs || []).length ? `<div class="docs">${s.employee_docs.sort((a, b) => a.valid_to.localeCompare(b.valid_to)).map(chip).join('')}</div>` : ''}</div>`).join('') || '<p class="mute">Работников нет</p>'}</div></section>
  <p class="demo">Зарплаты посчитаны по ставкам ${YEAR} упрощённо. Точные цифры — в ведомости бюро.</p>`;
}

function vDocs(d) {
  const open = d.requests.filter(r => r.status === 'open'), rest = d.requests.filter(r => r.status !== 'open').slice(0, 10);
  const closed = d.year.filter(m => m.closed).reverse();
  return `
  <section class="card"><div class="card-h"><h2>Бюро ждёт от вас</h2><span class="small mute">${open.length}</span></div>
    <div>${open.map(r => `<div class="reqrow"><div class="main"><b>${esc(r.title)}</b><span>${esc(r.note || '')}${r.due ? ' · до ' + dDots(r.due) : ''}</span></div><button class="upbtn" data-upload="${r.id}">Загрузить</button></div>`).join('') || '<p class="mute">Сейчас ничего не нужно.</p>'}</div>
  </section>
  <section class="card"><h2>Отправить бюро</h2>
    <p class="small mute">Чек, фактура не из KSeF (например, немецкая Rechnung), договор — сфотографируйте или выберите файл.</p>
    <button class="btn block" data-upload="">Фото или файл</button>
  </section>
  ${rest.length ? `<section class="card"><h2>Уже отправлено</h2><div class="list">${rest.map(r => `<div class="row"><div class="ico in">✓</div><div class="main"><b>${esc(r.title)}</b><span>${r.status === 'done' ? 'принято бюро' : 'на проверке'}</span></div></div>`).join('')}</div></section>` : ''}
  ${d.documents.length ? `<section class="card"><h2>Ваши файлы</h2><div class="list">${d.documents.slice(0, 15).map(x => `<div class="row"><div class="ico in">📄</div><div class="main"><b>${esc(x.name)}</b><span>${dDots(x.created_at.slice(0, 10))}</span></div></div>`).join('')}</div></section>` : ''}
  <section class="card"><div class="card-h"><h2>Справка о доходах</h2></div>

function shAnalytics(d) {
  const f = d.firm, w = S.what || { p: 0, price: 0, b: 7000 };
  const ms = d.year.filter(m => m.ym < CUR && m.closed), avg = k => ms.length ? ms.reduce((s, m) => s + m[k], 0) / ms.length : 0;
  const rev = avg('rev'), costs = avg('costsAll'), base = avg('mine');
  const nrev = rev * (1 + w.price / 100), ncost = costs + w.p * Calc.wage(w.b, 'uop').cost, profit = nrev - ncost, R = Calc.RATES;
  let nmine; if (f.type === 'jdg') { const sp = R.zusSpol[f.zus_mode] || 0, inc = Math.max(0, profit - sp);
    if (f.tax_form === 'ryczalt') { const zd = R.zdrRyczalt.find(([lim]) => nrev * 12 <= lim)[1]; nmine = profit - sp - zd - Math.max(0, nrev - sp - zd * 0.5) * (+f.ryczalt_rate || 0.055); }
    else if (f.tax_form === 'skala') { const zd = Math.max(R.zdrMin, inc * R.zdrSkala); nmine = profit - sp - zd - Math.max(0, inc * R.skala.rate1 - R.skala.kwotaZmn / 12); }
    else { const zd = Math.max(R.zdrMin, inc * R.zdrLin); nmine = profit - sp - zd - Math.max(0, inc - Math.min(zd, R.zdrLinLimit / 12)) * R.pitLin; } }
  else nmine = Math.max(0, profit - Math.max(0, profit) * (R.cit[f.tax_form] || .09)) * (1 - R.divPit);
  let acc = 0; const cum = d.year.map(m => acc += m.mine), W = 340, H = 150, pl = 40, pb = 22, pt = 10, ticks = niceTicks(0, Math.max(...cum, 1)), max = ticks[ticks.length - 1];
  const y = v => H - pb - v / max * (H - pb - pt), x = i => pl + i * (W - pl - 10) / Math.max(1, cum.length - 1);
  const pathD = 'M' + cum.map((v, i) => x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('L');
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${mineLabel(f)} нарастающим итогом">`;
  ticks.forEach(v => { svg += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text class="ax" x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${short(v)}</text>`; });
  svg += `<path d="${pathD}L${x(cum.length - 1)} ${H - pb}L${pl} ${H - pb}Z" fill="var(--acc)" opacity=".12"/><path d="${pathD}" fill="none" stroke="var(--acc)" stroke-width="2.2"/><circle cx="${x(cum.length - 1)}" cy="${y(cum[cum.length - 1])}" r="4" fill="var(--acc)"/>`;
  d.year.forEach((m, i) => { if (i % 3 === 0 || i === d.year.length - 1) svg += `<text class="ax" x="${x(i)}" y="${H - 6}" text-anchor="middle">${MON_S[+m.ym.slice(5) - 1]}</text>`; });
  svg += '</svg>';
  const dl = nmine - base;
  return `<div class="sheet-h"><h2>Аналитика</h2><button class="x" data-close aria-label="Закрыть">×</button></div>
   <section class="card chart"><h2 style="font-size:16px">${mineLabel(f)}, с начала года</h2>${svg}</section>
   <section class="card"><h2 style="font-size:16px">Что если</h2>
    <p class="small mute">Средний закрытый месяц: ${mineLabel(f).toLowerCase()} <b class="num" style="color:var(--ink)">${zl(base)}</b></p>
    <div class="field"><label for="wP">Нанять ещё <b>${w.p}</b> чел. на umowę o pracę, ${zl(w.b)} брутто</label><input type="range" id="wP" min="0" max="5" step="1" value="${w.p}"></div>
    <div class="field"><label for="wPrice">Изменить цены на <b>${w.price}</b>%</label><input type="range" id="wPrice" min="-10" max="25" step="1" value="${w.price}"></div>
    <div class="cmp"><div><span>Было в месяц</span><b class="num">${zl(base)}</b></div><div><span>Станет в месяц</span><b class="num ${dl >= 0 ? 'delta-up' : 'delta-down'}">${zl(nmine)}</b></div></div>
    <p class="small mute">${dl >= 0 ? '+' : ''}${zl(dl)} в месяц. Новый человек стоит фирме ${zl(Calc.wage(w.b, 'uop').cost)} в месяц — он должен приносить больше выручки.</p>
   </section>`;
}

  lastFocus = document.activeElement; $('#sheetIn').innerHTML = '<div class="grab"></div>' + html;
  const sh = $('#sheet'), sc = $('#scrim'); sh.hidden = false; sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add('on'); sc.classList.add('on'); });
  const fx = sh.querySelector('input,select,textarea,button.x'); if (fx) setTimeout(() => fx.focus(), 60);
}
function closeSheet() { const sh = $('#sheet'), sc = $('#scrim'); sh.classList.remove('on'); sc.classList.remove('on'); setTimeout(() => { sh.hidden = true; sc.hidden = true; }, 230); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2800); }
const numIn = id => { const v = $(id) && $(id).value.trim(); if (!v) return null; const n = Import.num(v); return isNaN(n) ? null : r2(n); };

/* ---------- импорт ---------- */
async function importStatement(text, d) {
  const r = Import.parseStatement(text); if (!r.ops.length) throw new Error('В файле не нашли операций. Нужен CSV или MT940 из банка');
  const fid = d.firm.id, rows = r.ops.map(o => ({ firm_id: fid, date: o.date, amount: o.amount, description: o.description, category: o.category, hash: o.hash }));
  const ins = await q(sb.from('bank_tx').upsert(rows, { onConflict: 'firm_id,hash', ignoreDuplicates: true }).select('id,date,amount,category'));
  // сопоставление с фактурами и платежами
  let matched = 0, taxPaid = 0; const g = i => Calc.pln(i) + Calc.plnVat(i);
  const unpaid = d.invoices.filter(i => !i.paid_at), obl = obligationsOf(d).filter(o => !o.paid_at);
  for (const t of ins || []) {
    const inv = unpaid.find(i => !i._m && Math.abs(g(i) - Math.abs(t.amount)) < 1 && ((i.kind === 'sale') === (t.amount > 0)));
    if (inv) { inv._m = 1; matched++; await q(sb.from('invoices').update({ paid_at: t.date }).eq('id', inv.id)); await q(sb.from('bank_tx').update({ invoice_id: inv.id }).eq('id', t.id)); continue; }
    if (t.amount < 0 && (t.category === 'ZUS' || t.category === 'Налоги')) {
      const o = obl.find(o => !o._m && Math.abs(o.amt - Math.abs(t.amount)) < 1 && (t.category === 'ZUS' ? o.kind === 'zus' : o.kind !== 'zus'));
      if (o) { o._m = 1; taxPaid++; await q(sb.from('payments').upsert({ firm_id: fid, ym: o.ym, kind: o.kind, paid_at: t.date })); }
    }
  }
  if (r.close != null) await q(sb.from('bank_balances').upsert({ firm_id: fid, date: r.closeDate || r.ops[r.ops.length - 1].date, balance: r.close, source: 'выписка' }));
  await sb.from('audit_log').insert({ firm_id: fid, action: 'statement_import', detail: { ops: r.ops.length, new: (ins || []).length } });
  return { total: r.ops.length, added: (ins || []).length, matched, taxPaid, close: r.close };
}
async function importJPK(text, d) {
  const j = Import.parseJPK(text), fid = d.firm.id;
  if (!j.sales.length && !j.costs.length) throw new Error('В файле нет строк продаж и покупок');
  const period = j.period || (j.sales[0] || j.costs[0]).issue_date.slice(0, 7);
  const have = new Set(d.invoices.filter(i => i.source !== 'jpk').map(i => i.kind + '|' + (i.number || '').trim().toLowerCase()));
  const from = period + '-01', to = Calc.ymAdd(period, 1) + '-01';
  await q(sb.from('invoices').delete().eq('firm_id', fid).eq('source', 'jpk').gte('issue_date', from).lt('issue_date', to));
  const rows = [...j.sales, ...j.costs].filter(x => !have.has(x.kind + '|' + (x.number || '').trim().toLowerCase()))
    .map(x => ({ firm_id: fid, kind: x.kind, number: x.number, issue_date: x.issue_date || from, counterparty: x.counterparty, cp_nip: x.cp_nip, net: x.net, vat: x.vat, vat_rate: x.vat_rate, category: x.kind === 'sale' ? 'Выручка' : (x.category || 'Прочие расходы'), source: 'jpk' }));
  if (rows.length) await q(sb.from('invoices').insert(rows));
  await sb.from('audit_log').insert({ firm_id: fid, action: 'jpk_import', detail: { period, rows: rows.length } });
  return { period, sales: j.sales.length, costs: j.costs.length, added: rows.length, skipped: j.sales.length + j.costs.length - rows.length };
}
function readFile(file) { return new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(rd.result); rd.onerror = rej; rd.readAsText(file, /\.(sta|940|mt940)$/i.test(file.name) ? 'windows-1250' : 'utf-8'); }); }
async function handleImport(kind, file) {
  const d = D(); let text = await readFile(file);
  if (kind === 'stmt' && /\uFFFD/.test(text)) { const rd = await new Promise(r => { const x = new FileReader(); x.onload = () => r(x.result); x.readAsText(file, 'windows-1250'); }); text = rd; }
  if (kind === 'stmt') { const r = await importStatement(text, d); await reload();
    openSheet(`<div class="sheet-h"><h2>Выписка загружена</h2><button class="x" data-close aria-label="Закрыть">×</button></div><section class="card"><div class="eq"><span class="op"></span><span>Операций в файле</span><b>${r.total}</b></div><div class="eq"><span class="op"></span><span>Новых</span><b>${r.added}</b></div><div class="eq"><span class="op"></span><span>Отмечено оплаченных фактур</span><b>${r.matched}</b></div><div class="eq"><span class="op"></span><span>Отмечено налоговых платежей</span><b>${r.taxPaid}</b></div>${r.close != null ? `<div class="eq total"><span class="op"></span><span>Остаток по выписке</span><b class="num">${zl(r.close, 2)}</b></div>` : '<p class="small mute">В файле нет остатка — впишите его вручную.</p>'}</section><button class="btn block" data-close>Готово</button>`); }
  else { const r = await importJPK(text, d); await reload();
    openSheet(`<div class="sheet-h"><h2>JPK за ${ymName(r.period)}</h2><button class="x" data-close aria-label="Закрыть">×</button></div><section class="card"><div class="eq"><span class="op"></span><span>Строк продаж</span><b>${r.sales}</b></div><div class="eq"><span class="op"></span><span>Строк покупок</span><b>${r.costs}</b></div><div class="eq"><span class="op"></span><span>Уже были из KSeF</span><b>${r.skipped}</b></div><div class="eq total"><span class="op"></span><span>Добавлено</span><b>${r.added}</b></div></section><button class="btn block" data-close>Готово</button>`); }
}
async function uploadDoc(file, reqId) {
  const fid = S.firmId, safe = file.name.replace(/[^\w.\-]+/g, '_').slice(-80), path = `${fid}/${crypto.randomUUID()}-${safe}`;
  const up = await sb.storage.from('docs').upload(path, file, { contentType: file.type || 'application/octet-stream' }); if (up.error) throw up.error;
  await q(sb.from('documents').insert({ firm_id: fid, request_id: reqId || null, path, name: file.name, kind: reqId ? 'request' : 'document' }));
  notifyEvent({ mode: 'doc_uploaded', firm_id: fid, name: file.name });
  await reload();
}

async function start() {

  $('#boot').classList.add('hidden');
  if (!session) { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }

  try {
    S.user = session.user;
    const staff = await q(sb.from('staff').select('user_id').eq('user_id', S.user.id));
    S.staff = staff.length > 0;
    S.firms = await q(sb.from('firms').select('*').order('name'));
    if (!S.firms.length) { $('#boot').innerHTML = '<p>Для вашей почты пока нет фирмы. Напишите в бюро.</p><button class="btn" onclick="sb.auth.signOut().then(()=>location.reload())">Выйти</button>'; return; }

    if (S.staff) await Promise.all(S.firms.map(f => loadFirm(f.id))); else await loadFirm(S.firmId);
    const h = location.hash.slice(1); if (['home', 'money', 'taxes', 'people', 'docs'].includes(h)) S.tab = h;
    $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden'); render();
    loadNotes(); setInterval(loadNotes, 120000);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e) { console.error(e); $('#boot').innerHTML = '<p>Не получилось загрузить данные: ' + esc(e.message) + '</p>'; }
}
